<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout — Nestora</title><link rel="stylesheet" href="styles.css"></head><body>
<header class="nav"><div class="container"><a class="logo" href="index.html"><span class="logo-mark">N</span>Nestora</a><span class="muted">🔒 Secure checkout</span></div></header><main><section class="page-hero"><div class="container"><a class="link" href="cart.html">← Back to cart</a><h1>Delivery & payment</h1></div></section><div class="container checkout-layout"><form class="panel" id="checkoutForm"><h2>Delivery details</h2><p class="muted">Tell us where and when to set up your products.</p><div class="form-grid"><div class="field"><label>Full name</label><input name="customerName" required placeholder="Aarav Sharma"></div><div class="field"><label>Phone number</label><input name="phone" required type="tel" pattern="[0-9]{10}" placeholder="9876543210"></div><div class="field full"><label>Complete address</label><textarea name="address" required rows="3" placeholder="Flat, building, street and landmark"></textarea></div><div class="field"><label>City</label><select name="city" required><option value="">Choose city</option><option>Delhi NCR</option><option>Mumbai</option><option>Bengaluru</option><option>Hyderabad</option><option>Pune</option></select></div><div class="field"><label>PIN code</label><input name="pinCode" required pattern="[0-9]{6}" placeholder="110001"></div><div class="field"><label>Preferred delivery date</label><input name="deliveryDate" required type="date"></div><div class="field"><label>Time slot</label><select name="timeSlot" required><option>9 AM – 12 PM</option><option>12 PM – 3 PM</option><option>3 PM – 6 PM</option></select></div></div><h2 style="margin:25px 0 15px">Payment method</h2><div class="field"><label>Card number</label><input required pattern="[0-9 ]{15,19}" placeholder="1234 5678 9012 3456"></div><div class="form-grid"><div class="field"><label>Expiry</label><input required placeholder="MM / YY"></div><div class="field"><label>CVV</label><input required type="password" pattern="[0-9]{3}" placeholder="•••"></div></div><button class="btn btn-block" type="submit">Pay securely <span data-total>₹0</span></button></form><aside class="panel" style="height:max-content"><h2>Payment summary</h2><div class="summary-row"><span>Monthly rent</span><b data-subtotal>₹0</b></div><div class="summary-row"><span>Refundable deposit</span><b data-deposit>₹0</b></div><div class="summary-row summary-total"><span>Due today</span><span data-total>₹0</span></div><p class="muted">🛡️ Payments are encrypted and secure.</p></aside></div></main><script src="app.js"></script></body></html>
